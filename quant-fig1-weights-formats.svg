<svg viewBox="0 0 680 690" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>模型权重：参数构成、数值格式与大小测算</title>
<desc>以 Qwen3-0.6B 为例：参数量分解、FP32 到 INT4 的位分配、各量化格式的文件大小表与 KV cache 测算。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>.th{font-family:sans-serif;font-size:14px;font-weight:500;fill:#E6EDF3}.ts{font-family:sans-serif;font-size:12px;fill:#9AA7B4}.tb{font-family:sans-serif;font-size:12.5px;fill:#C9D4DE}.tm{font-family:monospace;font-size:12px;fill:#8FBCE8}</style>

<text class="th" x="40" y="30">模型权重：参数构成 · 数值格式 · 大小测算（Qwen3-0.6B 实例）</text>
<text class="ts" x="40" y="48">权重 = 训练学到的参数张量（Wq/Wk/Wv/Wo、FFN 矩阵、Embedding 表）；推理阶段只读不更新</text>

<rect x="40" y="62" width="600" height="80" rx="8" fill="#161B22" stroke="#2D3641" stroke-width="0.5"/>
<text class="tb" x="56" y="84">每层 = Attention（Wq 1024×2048 + Wk/Wv 1024×1028×2 + Wo 2048×1024 ≈ 6.29M）</text>
<text class="tb" x="56" y="104">           + FFN（gate/up/down 3×1024×3072 ≈ 9.44M）+ QK/RMSNorm ≈ 15.7M，共 28 层</text>
<text class="tb" x="56" y="126">Embedding 151,936 × 1024 = 155.6M（输入/输出共享 tie_word_embeddings）→ 总计 596,049,920 参数</text>

<rect x="40" y="154" width="266" height="26" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<rect x="306" y="154" width="177" height="26" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.5"/>
<rect x="483" y="154" width="156" height="26" fill="#633806" stroke="#FAC775" stroke-width="0.5"/>
<rect x="639" y="154" width="1.5" height="26" fill="#5F5E5A"/>
<text x="173" y="167" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:11px;fill:#B5D4F4">FFN 264.2M · 44.3%</text>
<text x="394" y="167" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:11px;fill:#CECBF6">Attention 176.2M · 29.5%</text>
<text x="561" y="167" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:10.5px;fill:#FAC775">Embed 155.6M · 26%</text>
<text class="ts" x="40" y="194">小模型特性：Embedding 占 26%（8B 模型里同词表仅 ~4%）→ 量化时 embedding 常被单独高精度处理</text>

<text class="th" x="40" y="224">数值格式：位分配决定「动态范围 vs 精度」</text>

<text class="tb" x="56" y="248">FP32</text>
<rect x="140" y="240" width="12" height="16" fill="#791F1F"/><rect x="152" y="240" width="96" height="16" fill="#633806"/><rect x="248" y="240" width="276" height="16" fill="#0C447C"/>
<text x="200" y="248" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:10.5px;fill:#FAC775">e ×8</text>
<text x="386" y="248" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:10.5px;fill:#B5D4F4">m ×23</text>
<text class="ts" x="536" y="248">4B · 训练精度</text>

<text class="tb" x="56" y="274">FP16</text>
<rect x="140" y="266" width="12" height="16" fill="#791F1F"/><rect x="152" y="266" width="60" height="16" fill="#633806"/><rect x="212" y="266" width="120" height="16" fill="#0C447C"/>
<text x="182" y="274" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:10.5px;fill:#FAC775">e ×5</text>
<text x="272" y="274" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:10.5px;fill:#B5D4F4">m ×10</text>
<text class="ts" x="348" y="274">2 字节 · 范围窄（±65504）、精度高</text>

<text class="tb" x="56" y="300">BF16</text>
<rect x="140" y="292" width="12" height="16" fill="#791F1F"/><rect x="152" y="292" width="96" height="16" fill="#633806"/><rect x="248" y="292" width="84" height="16" fill="#0C447C"/>
<text x="200" y="300" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:10.5px;fill:#FAC775">e ×8</text>
<text x="290" y="300" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:10.5px;fill:#B5D4F4">m ×7</text>
<text class="ts" x="348" y="300">2 字节 · 范围同 FP32 · LLM 训练/推理事实标准</text>

<text class="tb" x="56" y="326">FP8 E4M3</text>
<rect x="140" y="318" width="12" height="16" fill="#791F1F"/><rect x="152" y="318" width="48" height="16" fill="#633806"/><rect x="200" y="318" width="36" height="16" fill="#0C447C"/>
<text x="218" y="326" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:10.5px;fill:#FAC775">e×4</text>
<text class="ts" x="252" y="326">1 字节 · GPU 硬件原生（Hopper/Blackwell）</text>

<text class="tb" x="56" y="352">INT8</text>
<rect x="140" y="344" width="96" height="16" fill="#085041" stroke="#9FE1CB" stroke-width="0.5"/>
<text x="188" y="352" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:10.5px;fill:#9FE1CB">整数 ×8</text>
<text class="ts" x="252" y="352">均匀格点 · 需 scale/zero-point 映射</text>

<text class="tb" x="56" y="378">INT4</text>
<rect x="140" y="370" width="48" height="16" fill="#085041" stroke="#9FE1CB" stroke-width="0.5"/>
<text x="164" y="378" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:10.5px;fill:#9FE1CB">×4</text>
<text class="ts" x="252" y="378">0.5 字节/权重 · 仅有 16 个格点 · 压缩极限</text>

<rect x="140" y="394" width="8" height="8" fill="#791F1F"/><text class="ts" x="152" y="402">符号位</text>
<rect x="196" y="394" width="8" height="8" fill="#633806"/><text class="ts" x="208" y="402">指数 = 动态范围</text>
<rect x="296" y="394" width="8" height="8" fill="#0C447C"/><text class="ts" x="308" y="402">尾数 = 精度</text>
<rect x="380" y="394" width="8" height="8" fill="#085041"/><text class="ts" x="392" y="402">整数 = 均匀格点（浮点是非均匀格点）</text>

<text class="th" x="40" y="434">Qwen3-0.6B 各格式大小（文件大小 ≈ 参数量 × bpw ÷ 8）</text>

<rect x="40" y="448" width="600" height="20" fill="#1B222C"/>
<text class="ts" x="56" y="458" dominant-baseline="central">格式</text><text class="ts" x="140" y="458" dominant-baseline="central">bpw</text><text class="ts" x="180" y="458" dominant-baseline="central">相对大小</text><text class="ts" x="390" y="458" dominant-baseline="central">体积</text><text class="ts" x="450" y="458" dominant-baseline="central">备注</text>

<g>
<rect x="40" y="468" width="600" height="21" fill="#131820"/><text class="tb" x="56" y="479" dominant-baseline="central">F16 / BF16</text><text class="tb" x="140" y="479" dominant-baseline="central">16.0</text><rect x="180" y="472" width="200" height="12" fill="#2E5C8A"/><text class="tb" x="390" y="479" dominant-baseline="central">1.19 GB</text><text class="ts" x="450" y="479" dominant-baseline="central">基准（磁盘 = 显存）</text>
<rect x="40" y="489" width="600" height="21" fill="#161B22" stroke="#FAC775" stroke-width="0.5"/><text class="tb" x="56" y="500" dominant-baseline="central">Q8_0</text><text class="tb" x="140" y="500" dominant-baseline="central">8.5</text><rect x="180" y="493" width="106" height="12" fill="#B8863B"/><text class="tb" x="390" y="500" dominant-baseline="central">0.63 GB</text><text class="ts" x="450" y="500" dominant-baseline="central">≈无损 · 官方常发货位</text>
<rect x="40" y="510" width="600" height="21" fill="#131820"/><text class="tb" x="56" y="521" dominant-baseline="central">Q6_K</text><text class="tb" x="140" y="521" dominant-baseline="central">6.56</text><rect x="180" y="514" width="82" height="12" fill="#2E5C8A"/><text class="tb" x="390" y="521" dominant-baseline="central">0.49 GB</text><text class="ts" x="450" y="521" dominant-baseline="central">近无损</text>
<rect x="40" y="531" width="600" height="21" fill="#161B22"/><text class="tb" x="56" y="542" dominant-baseline="central">Q5_K_M</text><text class="tb" x="140" y="542" dominant-baseline="central">5.70</text><rect x="180" y="536" width="72" height="12" fill="#2E5C8A"/><text class="tb" x="390" y="542" dominant-baseline="central">0.43 GB</text><text class="ts" x="450" y="542" dominant-baseline="central">质量敏感场景</text>
<rect x="40" y="552" width="600" height="21" fill="#131820" stroke="#FAC775" stroke-width="0.5"/><text class="tb" x="56" y="563" dominant-baseline="central">Q4_K_M</text><text class="tb" x="140" y="563" dominant-baseline="central">4.89</text><rect x="180" y="557" width="62" height="12" fill="#B8863B"/><text class="tb" x="390" y="563" dominant-baseline="central">0.37 GB</text><text class="ts" x="450" y="563" dominant-baseline="central">体积/质量甜点 · 社区默认</text>
<rect x="40" y="573" width="600" height="21" fill="#161B22"/><text class="tb" x="56" y="584" dominant-baseline="central">Q3_K_M</text><text class="tb" x="140" y="584" dominant-baseline="central">4.00</text><rect x="180" y="578" width="50" height="12" fill="#2E5C8A"/><text class="tb" x="390" y="584" dominant-baseline="central">0.30 GB</text><text class="ts" x="450" y="584" dominant-baseline="central">0.6B 级小模型慎用</text>
<rect x="40" y="594" width="600" height="21" fill="#131820"/><text class="tb" x="56" y="605" dominant-baseline="central">Q2_K</text><text class="tb" x="140" y="605" dominant-baseline="central">3.16</text><rect x="180" y="599" width="40" height="12" fill="#2E5C8A"/><text class="tb" x="390" y="605" dominant-baseline="central">0.24 GB</text><text class="ts" x="450" y="605" dominant-baseline="central">明显退化 · 仅极限场景</text>
</g>

<rect x="40" y="626" width="600" height="48" rx="8" fill="#161B22" stroke="#2D3641" stroke-width="0.5"/>
<text class="tb" x="56" y="644">运行内存 = 权重 + KV cache + 运行时开销（10~20%）</text>
<text class="tb" x="56" y="664">KV ≈ 2 × 28 层 × 8 KV头 × 128 维 × 2B ≈ 112KB/token → 4K 上下文 ≈ 448MB（q8_0 KV 可减半）</text>
</svg>
