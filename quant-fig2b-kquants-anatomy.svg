<svg viewBox="0 0 680 450" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Q8_0、Q4_K、Q6_K 位级存储布局解剖</title>
<desc>三种量化格式的字节级布局、字段角色、bpw 计算与误差来源对比。</desc>
<style>.th{font-family:sans-serif;font-size:14px;font-weight:500;fill:#E6EDF3}.ts{font-family:sans-serif;font-size:11.5px;fill:#9AA7B4}.tb{font-family:sans-serif;font-size:12px;fill:#C9D4DE}.bb{font-family:sans-serif;font-size:13px;font-weight:500;fill:#F1EFE8}</style>
<text class="th" x="40" y="28">Q8_0 · Q4_K · Q6_K：每个字节花在哪</text>
<text class="ts" x="40" y="46">蓝 = 元数据（scale/偏置）· 绿 = 权重本体 · 段宽为示意 · bpw = 总 bit ÷ 权重数</text>
<rect x="40" y="70" width="80" height="36" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="bb" x="80" y="88" text-anchor="middle" dominant-baseline="central">Q8_0</text>
<text class="ts" x="40" y="124">遗留块格式</text>
<text class="ts" x="40" y="140">块 = 32 权重</text>
<rect x="140" y="70" width="55" height="36" rx="4" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text class="tb" x="167" y="88" text-anchor="middle" dominant-baseline="central">d 2B</text>
<rect x="195" y="70" width="320" height="36" rx="4" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text class="tb" x="355" y="88" text-anchor="middle" dominant-baseline="central">q · int8 × 32 · 32B</text>
<rect x="545" y="70" width="95" height="36" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="bb" x="592" y="88" text-anchor="middle" dominant-baseline="central">8.5 bpw</text>
<text class="ts" x="592" y="122" text-anchor="middle">272 bit ÷ 32</text>
<text class="ts" x="140" y="122">d = 块缩放（FP16 原始精度）· q = 8bit 有符号（−127..127）</text>
<text class="ts" x="140" y="138">重建 w ≈ d·q　总 bit = 16 + 256 = 272</text>
<text class="ts" x="140" y="154">步长 1/127 → 误差 ≈ ±0.4%，scale 无损 → 近无损</text>
<line x1="40" y1="176" x2="640" y2="176" stroke="#2D3641" stroke-width="0.5"/>
<rect x="40" y="190" width="80" height="36" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="bb" x="80" y="208" text-anchor="middle" dominant-baseline="central">Q4_K</text>
<text class="ts" x="40" y="244">k-quant 超块</text>
<text class="ts" x="40" y="260">256 权重 / 8 子块</text>
<rect x="140" y="190" width="48" height="36" rx="4" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text class="tb" x="164" y="208" text-anchor="middle" dominant-baseline="central">d</text>
<rect x="188" y="190" width="48" height="36" rx="4" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text class="tb" x="212" y="208" text-anchor="middle" dominant-baseline="central">dmin</text>
<rect x="236" y="190" width="105" height="36" rx="4" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text class="tb" x="288" y="208" text-anchor="middle" dominant-baseline="central">scales 12B</text>
<rect x="341" y="190" width="174" height="36" rx="4" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text class="tb" x="428" y="208" text-anchor="middle" dominant-baseline="central">q · 4bit × 256</text>
<rect x="545" y="190" width="95" height="36" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="bb" x="592" y="208" text-anchor="middle" dominant-baseline="central">4.5 bpw</text>
<text class="ts" x="592" y="242" text-anchor="middle">1152 bit ÷ 256</text>
<text class="ts" x="140" y="242">d·dmin = 超块级 FP16 · scales = 8 子块 ×（6bit scale + 6bit min），被 d/dmin 二次缩放</text>
<text class="ts" x="140" y="258">重建 w ≈ d·(q·sᵢ + mᵢ)　总 bit = 16+16+96+1024 = 1152</text>
<text class="ts" x="140" y="274">步长 1/15 → 误差 ≈ ±3.3% + scale 二次量化误差（两级缩放的代价）</text>
<line x1="40" y1="296" x2="640" y2="296" stroke="#2D3641" stroke-width="0.5"/>
<rect x="40" y="310" width="80" height="36" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="bb" x="80" y="328" text-anchor="middle" dominant-baseline="central">Q6_K</text>
<text class="ts" x="40" y="364">k-quant 超块</text>
<text class="ts" x="40" y="380">256 权重 / 16 子块</text>
<rect x="140" y="310" width="40" height="36" rx="4" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text class="tb" x="160" y="328" text-anchor="middle" dominant-baseline="central">d</text>
<rect x="180" y="310" width="80" height="36" rx="4" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text class="tb" x="220" y="328" text-anchor="middle" dominant-baseline="central">s · int8 ×16</text>
<rect x="260" y="310" width="160" height="36" rx="4" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text class="tb" x="340" y="328" text-anchor="middle" dominant-baseline="central">ql · 低4bit ×256</text>
<rect x="420" y="310" width="95" height="36" rx="4" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text class="tb" x="467" y="328" text-anchor="middle" dominant-baseline="central">qh · 高2bit ×64</text>
<rect x="545" y="310" width="95" height="36" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="bb" x="592" y="328" text-anchor="middle" dominant-baseline="central">6.5625 bpw</text>
<text class="ts" x="592" y="362" text-anchor="middle">1680 bit ÷ 256</text>
<text class="ts" x="140" y="362">scales = 每 16 权重一个 8bit 有符号 scale（不二次量化）· 6bit 权重 = ql(低4)+qh(高2) 拼位</text>
<text class="ts" x="140" y="378">重建 w ≈ d·q　总 bit = 16+1024+512+128 = 1680</text>
<text class="ts" x="140" y="394">步长 1/63 → 误差 ≈ ±0.8%，scale 精细 → 质量甜点</text>
<text class="ts" x="40" y="420">Q5_K = Q4_K 布局 + qh 32B（每权重第 5 位）→ 1408 bit / 256 = 5.5 bpw（_S 变体）</text>
<text class="ts" x="40" y="436">Q8_0 不属于 k-quant 家族：8bit 误差本已可忽略 + 字节天然对齐，无需超块 → 保留作近无损基准</text>
</svg>
