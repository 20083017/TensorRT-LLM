<svg viewBox="0 0 680 660" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>量化方法全景：按代价与量化对象分类</title>
<desc>PTQ 训练后量化方法（RTN、GPTQ、AWQ、GGUF k-quants/IQ、SmoothQuant、FP8、NVFP4）与训练侧方法（QAT、QLoRA）的对比卡片。</desc>
<style>.th{font-family:sans-serif;font-size:14px;font-weight:500;fill:#E6EDF3}.ts{font-family:sans-serif;font-size:11.5px;fill:#9AA7B4}.tb{font-family:sans-serif;font-size:12px;fill:#C9D4DE}.rl{font-family:sans-serif;font-size:12.5px;font-weight:500;fill:#FAC775}</style>

<text class="th" x="40" y="30">量化方法全景：不需要重训（PTQ）为主流，训练侧（QAT/QLoRA）做恢复</text>

<text class="rl" x="40" y="66">PTQ · 权重-only（校准数据可选~必需，无需训练）</text>
<rect x="40" y="78" width="146" height="128" rx="8" fill="#161B22" stroke="#2D3641" stroke-width="0.5"/>
<text class="th" x="113" y="100" text-anchor="middle">RTN</text>
<text class="ts" x="113" y="120" text-anchor="middle">round-to-nearest</text>
<text class="ts" x="113" y="138" text-anchor="middle">朴素取整基线</text>
<text class="ts" x="113" y="156" text-anchor="middle">零校准零成本</text>
<text class="ts" x="113" y="174" text-anchor="middle">8bit 尚可 4bit 损伤大</text>
<rect x="194" y="78" width="146" height="128" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text class="th" x="267" y="100" text-anchor="middle" fill="#B5D4F4">GPTQ</text>
<text class="ts" x="267" y="120" text-anchor="middle">逐层 Hessian 误差补偿</text>
<text class="ts" x="267" y="138" text-anchor="middle">最小化 ‖W·X − Ŵ·X‖²</text>
<text class="ts" x="267" y="156" text-anchor="middle">需校准集 128~512 条</text>
<text class="ts" x="267" y="174" text-anchor="middle">GPU 生态 4bit 主流</text>
<rect x="348" y="78" width="146" height="128" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text class="th" x="421" y="100" text-anchor="middle" fill="#B5D4F4">AWQ</text>
<text class="ts" x="421" y="120" text-anchor="middle">激活感知通道缩放</text>
<text class="ts" x="421" y="138" text-anchor="middle">激活大的通道=salient</text>
<text class="ts" x="421" y="156" text-anchor="middle">按激活幅度保护权重列</text>
<text class="ts" x="421" y="174" text-anchor="middle">与 GPTQ 同级 · 二选一</text>
<rect x="502" y="78" width="138" height="128" rx="8" fill="#633806" stroke="#FAC775" stroke-width="0.5"/>
<text class="th" x="571" y="100" text-anchor="middle" fill="#FAC775">k-quants / IQ</text>
<text class="ts" x="571" y="120" text-anchor="middle">GGUF super-block 分组</text>
<text class="ts" x="571" y="138" text-anchor="middle">256 权重/组+6bit scale</text>
<text class="ts" x="571" y="156" text-anchor="middle">IQ 系列配 imatrix</text>
<text class="ts" x="571" y="174" text-anchor="middle">llama.cpp/端侧生态</text>

<text class="rl" x="40" y="234">PTQ · 权重+激活 / 硬件原生浮点（GPU serving 路线）</text>
<rect x="40" y="246" width="194" height="128" rx="8" fill="#161B22" stroke="#2D3641" stroke-width="0.5"/>
<text class="th" x="137" y="268" text-anchor="middle">SmoothQuant</text>
<text class="ts" x="137" y="290" text-anchor="middle">激活 outlier 平滑迁移</text>
<text class="ts" x="137" y="308" text-anchor="middle">到权重（数学等价缩放）</text>
<text class="ts" x="137" y="326" text-anchor="middle">让 W 与 A 都能整数量化</text>
<text class="ts" x="137" y="344" text-anchor="middle">W8A8 kernel 端到端加速</text>
<rect x="242" y="246" width="194" height="128" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.5"/>
<text class="th" x="339" y="268" text-anchor="middle" fill="#CECBF6">FP8（E4M3/E5M2）</text>
<text class="ts" x="339" y="290" text-anchor="middle">浮点 8bit，保留动态范围</text>
<text class="ts" x="339" y="308" text-anchor="middle">无需整数映射技巧</text>
<text class="ts" x="339" y="326" text-anchor="middle">Hopper/Blackwell 原生</text>
<text class="ts" x="339" y="344" text-anchor="middle">TRT-LLM/vLLM 主推</text>
<rect x="444" y="246" width="196" height="128" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.5"/>
<text class="th" x="542" y="268" text-anchor="middle" fill="#CECBF6">NVFP4 / MXFP4</text>
<text class="ts" x="542" y="290" text-anchor="middle">块级 micro-scaling</text>
<text class="ts" x="542" y="308" text-anchor="middle">每 16/32 元素 1 个块 scale</text>
<text class="ts" x="542" y="326" text-anchor="middle">Blackwell 4bit 端到端</text>
<text class="ts" x="542" y="344" text-anchor="middle">最新一代，近乎无损</text>

<text class="rl" x="40" y="402">训练侧（量化后精度恢复 / 量化上训练）</text>
<rect x="40" y="414" width="194" height="128" rx="8" fill="#161B22" stroke="#2D3641" stroke-width="0.5"/>
<text class="th" x="137" y="436" text-anchor="middle">QAT</text>
<text class="ts" x="137" y="458" text-anchor="middle">训练中插入伪量化节点</text>
<text class="ts" x="137" y="476" text-anchor="middle">前向模拟量化噪声</text>
<text class="ts" x="137" y="494" text-anchor="middle">低位宽精度恢复最佳</text>
<text class="ts" x="137" y="512" text-anchor="middle">需要训练资源与数据</text>
<rect x="242" y="414" width="194" height="128" rx="8" fill="#085041" stroke="#9FE1CB" stroke-width="0.5"/>
<text class="th" x="339" y="436" text-anchor="middle" fill="#9FE1CB">QLoRA（NF4）</text>
<text class="ts" x="339" y="458" text-anchor="middle">冻结 4bit 量化底座</text>
<text class="ts" x="339" y="476" text-anchor="middle">只训练低秩 LoRA 适配器</text>
<text class="ts" x="339" y="494" text-anchor="middle">0.6B 微调 ~6GB 显存</text>
<text class="ts" x="339" y="512" text-anchor="middle">你们的 nlu_10 SFT 可用</text>
<rect x="444" y="414" width="196" height="128" rx="8" fill="#791F1F" stroke="#F7C1C1" stroke-width="0.5"/>
<text class="th" x="542" y="436" text-anchor="middle" fill="#F7C1C1">选型速查</text>
<text class="ts" x="542" y="458" text-anchor="middle">llama.cpp / 车机端侧</text>
<text class="ts" x="542" y="476" text-anchor="middle">→ k-quants + imatrix</text>
<text class="ts" x="542" y="494" text-anchor="middle">GPU serving → FP8/W8A8</text>
<text class="ts" x="542" y="512" text-anchor="middle">精度极限恢复 → QAT</text>

<rect x="40" y="566" width="600" height="72" rx="8" fill="#161B22" stroke="#2D3641" stroke-width="0.5"/>
<text class="tb" x="56" y="590">共同思想：量化误差集中在「少数重要通道/权重」上代价最大 —— GPTQ 用二阶信息找补偿方向，</text>
<text class="tb" x="56" y="610">AWQ 用激活幅度找重要列，imatrix 用领域数据统计重要性。校准集越贴近真实分布，量化越准。</text>
<text class="tb" x="56" y="630">FP8/NVFP4 走另一条路：不改数值含义，让硬件直接支持低精度浮点运算。</text>
</svg>
