<svg viewBox="0 0 680 560" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>schema 调优策略地图：诊断闭环、失败指纹到修正策略映射、能力边界</title>
<desc>针对 0.6B NLU 输出协议的 schema/prompt 调优方法论：评测闭环、六类失败指纹的对应策略、以及 schema 调优的能力边界。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>.th{font-family:sans-serif;font-size:14px;font-weight:500;fill:#E6EDF3}.ts{font-family:sans-serif;font-size:11.5px;fill:#9AA7B4}.tb{font-family:sans-serif;font-size:12px;fill:#C9D4DE}.bb{font-family:sans-serif;font-size:13px;font-weight:500;fill:#F1EFE8}</style>
<text class="th" x="40" y="28">Schema 调优 = 给 0.6B 降「表达难度」，不是给模型加「判断力」</text>
<text class="ts" x="40" y="46">诊断闭环 → 失败指纹映射 → 能力边界</text>
<rect x="40" y="70" width="130" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text class="bb" x="105" y="90" text-anchor="middle">固定评测集</text>
<text class="ts" x="105" y="110" text-anchor="middle">真实 + 边界 + 长尾</text>
<rect x="190" y="70" width="130" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text class="bb" x="255" y="90" text-anchor="middle">失败聚类分桶</text>
<text class="ts" x="255" y="110" text-anchor="middle">按失败指纹分组计数</text>
<rect x="340" y="70" width="130" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text class="bb" x="405" y="90" text-anchor="middle">命中修正策略</text>
<text class="ts" x="405" y="110" text-anchor="middle">见下表对应条目</text>
<rect x="490" y="70" width="130" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text class="bb" x="555" y="90" text-anchor="middle">greedy 重测 A/B</text>
<text class="ts" x="555" y="110" text-anchor="middle">格式率 / acc / 槽 F1</text>
<line x1="172" y1="98" x2="188" y2="98" stroke="#9AA7B4" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="322" y1="98" x2="338" y2="98" stroke="#9AA7B4" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="472" y1="98" x2="488" y2="98" stroke="#9AA7B4" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="bb" x="40" y="160">失败指纹 → 修正策略映射（哪类失败指向哪条设计缺陷）</text>
<rect x="40" y="170" width="210" height="22" fill="#161B22" stroke="#2D3641" stroke-width="0.5"/>
<text class="ts" x="52" y="181" dominant-baseline="central">失败指纹（线上/评测观测）</text>
<rect x="250" y="170" width="390" height="22" fill="#161B22" stroke="#2D3641" stroke-width="0.5"/>
<text class="ts" x="262" y="181" dominant-baseline="central">schema / prompt 修正策略</text>
<rect x="40" y="192" width="210" height="42" fill="#131820" stroke="#2D3641" stroke-width="0.5"/>
<text class="tb" x="145" y="213" text-anchor="middle" dominant-baseline="central">空 slot / 缺失表达混乱</text>
<rect x="250" y="192" width="390" height="42" fill="#131820" stroke="#2D3641" stroke-width="0.5"/>
<text class="tb" x="262" y="208">absence 语义全库统一（固定空串或占位，二选一）</text>
<text class="tb" x="262" y="226">few-shot 补「槽位缺失」的正例</text>
<rect x="40" y="234" width="210" height="42" fill="#131820" stroke="#2D3641" stroke-width="0.5"/>
<text class="tb" x="145" y="255" text-anchor="middle" dominant-baseline="central">近义 intent 互串</text>
<rect x="250" y="234" width="390" height="42" fill="#131820" stroke="#2D3641" stroke-width="0.5"/>
<text class="tb" x="262" y="250">枚举间距拉开或合并近义项 · few-shot 补边界对</text>
<text class="tb" x="262" y="268">（同一句式两个意图各给一个正例）</text>
<rect x="40" y="276" width="210" height="42" fill="#131820" stroke="#2D3641" stroke-width="0.5"/>
<text class="tb" x="145" y="297" text-anchor="middle" dominant-baseline="central">字段错位 / 嵌套混乱</text>
<rect x="250" y="276" width="390" height="42" fill="#131820" stroke="#2D3641" stroke-width="0.5"/>
<text class="tb" x="262" y="292">flatten 到深度 ≤1 · 字段序固定（intent 在前）</text>
<text class="tb" x="262" y="310">字段名语义化（city，而不是 slot_1）</text>
<rect x="40" y="318" width="210" height="42" fill="#131820" stroke="#2D3641" stroke-width="0.5"/>
<text class="tb" x="145" y="339" text-anchor="middle" dominant-baseline="central">夹带额外文本 / 输出超长</text>
<rect x="250" y="318" width="390" height="42" fill="#131820" stroke="#2D3641" stroke-width="0.5"/>
<text class="tb" x="262" y="334">max_tokens 贴近最短合法输出 · grammar 逐字段收紧</text>
<text class="tb" x="262" y="352">自由文本槽改受控词表 + other 兜底</text>
<rect x="40" y="360" width="210" height="42" fill="#131820" stroke="#2D3641" stroke-width="0.5"/>
<text class="tb" x="145" y="381" text-anchor="middle" dominant-baseline="central">数字 / 日期槽出错</text>
<rect x="250" y="360" width="390" height="42" fill="#131820" stroke="#2D3641" stroke-width="0.5"/>
<text class="tb" x="262" y="376">弃 number 类型（数字 token 化易错位）</text>
<text class="tb" x="262" y="394">改字符串 + 枚举粒度（low/mid/high，而非 23.5）</text>
<rect x="40" y="402" width="210" height="42" fill="#131820" stroke="#2D3641" stroke-width="0.5"/>
<text class="tb" x="145" y="423" text-anchor="middle" dominant-baseline="central">多意图压成单 intent</text>
<rect x="250" y="402" width="390" height="42" fill="#131820" stroke="#2D3641" stroke-width="0.5"/>
<text class="tb" x="262" y="418">协议写明「取主意图」规则 + few-shot 演示</text>
<text class="tb" x="262" y="436">或两阶段拆分：先 intent 后 slots（每步更简单）</text>
<rect x="40" y="462" width="290" height="78" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text class="bb" x="60" y="484">三位一体：schema = grammar = 校验</text>
<text class="ts" x="60" y="504">schema 直接编译成 GBNF 约束，校验规则同源生成</text>
<text class="ts" x="60" y="522">改 schema = 同时改约束与校验，不存在三处漂移</text>
<rect x="350" y="462" width="290" height="78" rx="8" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/>
<text class="bb" x="370" y="484">能力边界（诚实声明）</text>
<text class="ts" x="370" y="504">治「表达失败」：格式遵守率 ~95% → ~99.5%</text>
<text class="ts" x="370" y="522">不治「判断失败」：intent 判错根因在模型理解力 → SFT</text>
</svg>
