<svg viewBox="0 0 680 340" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>SFT 数据生产流水线</title>
  <desc>从契约冻结到上车替换的七个阶段，含质量闸门回炉路径</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="34" class="th" font-size="14" fill="#EEEDFE">SFT 数据生产流水线（nlu_10 · Qwen3-0.6B）</text>

  <polyline points="416,60 416,46 260,46 260,58" fill="none" stroke="#EF9F27" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="338" y="42" text-anchor="middle" font-size="12" fill="#FAC775">闸门不过 → 回炉重造</text>

  <line x1="169" y1="104" x2="193" y2="104" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="325" y1="104" x2="349" y2="104" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="481" y1="104" x2="505" y2="104" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="40" y="60" width="128" height="88" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.5"/>
    <text x="104" y="80" text-anchor="middle" dominant-baseline="central" class="th" font-size="14" fill="#EEEDFE">0 · 契约冻结</text>
    <text x="104" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#CECBF6">schema v2 定稿</text>
    <text x="104" y="114" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#CECBF6">chat template 冻结</text>
    <text x="104" y="130" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#CECBF6">（GGUF 内嵌模板）</text>
  </g>

  <g>
    <rect x="196" y="60" width="128" height="88" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="260" y="80" text-anchor="middle" dominant-baseline="central" class="th" font-size="14" fill="#E1F5EE">1 · 三源采集</text>
    <text x="260" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#9FE1CB">真实日志脱敏</text>
    <text x="260" y="114" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#9FE1CB">逆向合成 label→query</text>
    <text x="260" y="130" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#9FE1CB">大模型标注+人工抽检</text>
  </g>

  <g>
    <rect x="352" y="60" width="128" height="88" rx="8" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/>
    <text x="416" y="80" text-anchor="middle" dominant-baseline="central" class="th" font-size="14" fill="#FAEEDA">2 · 质量闸门</text>
    <text x="416" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FAC775">validator 全量校验</text>
    <text x="416" y="114" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FAC775">去重 / 覆盖率矩阵</text>
    <text x="416" y="130" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FAC775">ASR 噪声增强</text>
  </g>

  <g>
    <rect x="508" y="60" width="128" height="88" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="572" y="80" text-anchor="middle" dominant-baseline="central" class="th" font-size="14" fill="#E1F5EE">3 · 渲染切分</text>
    <text x="572" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#9FE1CB">同模板渲染 token 序列</text>
    <text x="572" y="114" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#9FE1CB">loss 只算 assistant 段</text>
    <text x="572" y="130" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#9FE1CB">分层切 train / eval</text>
  </g>

  <polyline points="572,148 572,174 104,174 104,196" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="40" y="200" width="128" height="88" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
    <text x="104" y="220" text-anchor="middle" dominant-baseline="central" class="th" font-size="14" fill="#E6F1FB">4 · LoRA SFT</text>
    <text x="104" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B5D4F4">LLaMA-Factory</text>
    <text x="104" y="254" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B5D4F4">template=qwen3 对齐</text>
    <text x="104" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B5D4F4">rank 8-16 / epoch 2-3</text>
  </g>

  <g>
    <rect x="196" y="200" width="128" height="88" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
    <text x="260" y="220" text-anchor="middle" dominant-baseline="central" class="th" font-size="14" fill="#E6F1FB">5 · 部署产物链</text>
    <text x="260" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B5D4F4">merge → GGUF convert</text>
    <text x="260" y="254" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B5D4F4">imatrix（同域校准）</text>
    <text x="260" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B5D4F4">quantize Q6_K / Q8_0</text>
  </g>

  <g>
    <rect x="352" y="200" width="128" height="88" rx="8" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/>
    <text x="416" y="220" text-anchor="middle" dominant-baseline="central" class="th" font-size="14" fill="#FAEEDA">6 · 全链路评测</text>
    <text x="416" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FAC775">格式率 / intent acc / F1</text>
    <text x="416" y="254" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FAC775">锚 Q8_0 · greedy+seed</text>
    <text x="416" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FAC775">SFT 后重跑量化评测</text>
  </g>

  <g>
    <rect x="508" y="200" width="128" height="88" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="572" y="220" text-anchor="middle" dominant-baseline="central" class="th" font-size="14" fill="#E1F5EE">7 · 上车</text>
    <text x="572" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#9FE1CB">输出即非思考母语</text>
    <text x="572" y="254" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#9FE1CB">解除 /no_think 依赖</text>
    <text x="572" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#9FE1CB">retry-rate 面板归零</text>
  </g>

  <line x1="169" y1="244" x2="193" y2="244" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="325" y1="244" x2="349" y2="244" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="481" y1="244" x2="505" y2="244" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="316" font-size="12" fill="#888780">质量红线：评测集与训练集分层切分 · 合成数据查重 · ASR 噪声必须覆盖 · SFT 后量化评测必须重跑（锚 Q8_0）</text>
</svg>