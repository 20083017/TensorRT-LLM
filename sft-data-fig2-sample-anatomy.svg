<svg viewBox="0 0 680 450" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>一条训练样本的解剖：messages 到 loss mask</title>
  <desc>展示 messages 结构、chat template 渲染后的 token 序列分段，以及 loss mask 只在 assistant 段生效</desc>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="32" font-size="14" font-weight="500" fill="#EEEDFE">一条训练样本的解剖：从 messages 到 loss mask</text>

  <g>
    <rect x="40" y="52" width="360" height="252" rx="8" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="56" y="74" font-size="12" fill="#888780">messages（训练样本数据格式，与线上 BuildRequest 同构）</text>
    <text x="56" y="96" font-size="11.5" font-family="monospace" fill="#D3D1C7">[</text>
    <text x="56" y="114" font-size="11.5" font-family="monospace" fill="#9FE1CB"> {"role":"system",</text>
    <text x="56" y="130" font-size="11.5" font-family="monospace" fill="#9FE1CB">  "content":"你是车载 NLU 引擎，按 nlu_10 协议输出"}</text>
    <text x="56" y="150" font-size="11.5" font-family="monospace" fill="#9FE1CB"> {"role":"user",</text>
    <text x="56" y="166" font-size="11.5" font-family="monospace" fill="#9FE1CB">  "content":"空调二十四度"}   ← ASR 噪声仿真</text>
    <text x="56" y="186" font-size="11.5" font-family="monospace" fill="#FAC775"> {"role":"assistant",</text>
    <text x="56" y="202" font-size="11.5" font-family="monospace" fill="#FAC775">  "content":"###NLU_START###</text>
    <text x="56" y="218" font-size="11.5" font-family="monospace" fill="#FAC775">   {\"intent\":\"hvac_set\",</text>
    <text x="56" y="234" font-size="11.5" font-family="monospace" fill="#FAC775">    \"temperature\":\"24\"}</text>
    <text x="56" y="250" font-size="11.5" font-family="monospace" fill="#FAC775">  ###NLU_END###"}</text>
    <text x="56" y="268" font-size="11.5" font-family="monospace" fill="#D3D1C7">]</text>
    <text x="56" y="290" font-size="11" fill="#888780">多轮样本：user 之前插入 history 消息，格式同线上</text>
  </g>

  <g>
    <rect x="424" y="52" width="216" height="70" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="532" y="76" text-anchor="middle" font-size="12" font-weight="500" fill="#E1F5EE">system 段</text>
    <text x="532" y="94" text-anchor="middle" font-size="11" fill="#9FE1CB">任务规则与协议说明</text>
    <text x="532" y="110" text-anchor="middle" font-size="11" fill="#9FE1CB">mask（不计算 loss）</text>
  </g>
  <g>
    <rect x="424" y="132" width="216" height="70" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="532" y="156" text-anchor="middle" font-size="12" font-weight="500" fill="#E1F5EE">user 段（含历史）</text>
    <text x="532" y="174" text-anchor="middle" font-size="11" fill="#9FE1CB">查询文本 + ASR 噪声仿真</text>
    <text x="532" y="190" text-anchor="middle" font-size="11" fill="#9FE1CB">mask（不计算 loss）</text>
  </g>
  <g>
    <rect x="424" y="212" width="216" height="92" rx="8" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/>
    <text x="532" y="238" text-anchor="middle" font-size="12" font-weight="500" fill="#FAEEDA">assistant 段</text>
    <text x="532" y="256" text-anchor="middle" font-size="11" fill="#FAC775">nlu_10 标准答案（唯一</text>
    <text x="532" y="272" text-anchor="middle" font-size="11" fill="#FAC775">通过 schema v2 validator</text>
    <text x="532" y="290" text-anchor="middle" font-size="11" fill="#FAC775">的输出）→ loss = 1</text>
  </g>

  <line x1="404" y1="300" x2="420" y2="300" stroke="none"/>

  <line x1="220" y1="312" x2="220" y2="336" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="260" y="330" font-size="12" fill="#888780">chat template 渲染（与线上同一模板）</text>

  <text x="40" y="362" font-size="12" fill="#888780">渲染后的 token 序列（示意，非等比例）：</text>

  <g>
    <rect x="40" y="372" width="100" height="26" rx="4" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="90" y="385" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#9FE1CB">模板控制 token</text>
    <rect x="144" y="372" width="120" height="26" rx="4" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="204" y="385" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#9FE1CB">system 内容</text>
    <rect x="268" y="372" width="100" height="26" rx="4" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="318" y="385" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#9FE1CB">user 内容</text>
    <rect x="172" y="0" width="0" height="0"/>
    <rect x="372" y="372" width="110" height="26" rx="4" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
    <text x="427" y="385" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#9FE1CB">生成头标记</text>
    <rect x="486" y="372" width="154" height="26" rx="4" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/>
    <text x="563" y="385" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#FAC775">assistant 输出（nlu_10）</text>
  </g>

  <g>
    <text x="90" y="412" text-anchor="middle" font-size="11" fill="#5DCAA5">mask=0</text>
    <text x="204" y="412" text-anchor="middle" font-size="11" fill="#5DCAA5">mask=0</text>
    <text x="318" y="412" text-anchor="middle" font-size="11" fill="#5DCAA5">mask=0</text>
    <text x="427" y="412" text-anchor="middle" font-size="11" fill="#5DCAA5">mask=0</text>
    <text x="563" y="412" text-anchor="middle" font-size="11" fill="#FAC775">loss=1</text>
  </g>

  <text x="40" y="438" font-size="12" fill="#888780">loss mask 的含义：模型只学习「生成标准答案」，不学习复述输入 —— 训练目标与推理目标严格一致</text>
</svg>